[project]
name = "colibre"
description = "Interface d'exploration et d'analyse des marchés publics français."
version = "3.2.0"
requires-python = ">= 3.10"
authors = [{ name = "Colin Maudry", email = "colin@colmo.tech" }]
dependencies = [
  "dash[compress]==4.4.1",
  "polars",
  "gunicorn",
  "dash-bootstrap-components",
  "python-dotenv",
  "xlsxwriter",
  "plotly[express]",
  "httpx",
  "pandas",                    # utilisé pour la création de certains graphiques
  "unidecode",
  "dash-leaflet",
  "dash-extensions",
  "duckdb",
  "flask-caching",
  "pyarrow>=23.0.1",
  "flask-login",
  "brevo-python==5.0.0rc1",
  "flask-wtf",
  "email-validator",
  "authlib",
  "orjson",
  "flask-cors>=6.0.2",
  "flask-smorest>=0.46.0",
  "marshmallow>=3.20.0",
  "boto3",
  "cryptography",
  "dash-ag-grid>=35.2.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-env",
  "pre-commit",
  "selenium",
  "webdriver-manager",
  "dash[testing]==4.4.1",
  "fastexcel",
  "openpyxl",
  "moto[s3]",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
env = [
  "DATA_FILE_PARQUET_PATH=tests/test.parquet",
  "CACHE_DIR=tests/cache",
  "DEVELOPMENT=true",
  "REBUILD_DUCKDB=true",
  "DATA_SCHEMA_PATH=/home/colin/git/decp-processing/dist/schema.json",
  "USERS_DB_PATH=tests/users.test.sqlite",
  "SECRET_KEY=test-secret-do-not-use-in-prod",
  "MAIL_FROM=test@colibre.fr",
  "MAIL_SUPPRESS_SEND=true",
  "APP_BASE_URL=http://localhost:8050",
  "SMTP_HOST=localhost",
  "SMTP_PORT=25",
  "WTF_CSRF_ENABLED=False",
  "MATOMO_TRACKING_ENABLED=false",
  "DATA_SCHEMA_LOCAL=/home/colin/git/decp-processing/dist/schema.json",
]
addopts = "-p no:warnings -m 'not integration and not selenium'"
markers = [
  # Ces tests sortent sur le réseau : Brevo refuse les IP non déclarées dans sa
  # liste d'autorisation, donc ils échouent depuis un lieu de travail nouveau ou
  # depuis la CI. Désélectionnés par défaut via addopts ; pour les lancer
  # délibérément depuis une IP autorisée : `uv run pytest -m integration`.
  "integration: tests touchant des services externes (Brevo)",
  # Tests navigateur : ils démarrent un serveur Dash et pilotent Chrome, donc
  # coûtent quelques secondes chacun là où les autres se comptent en
  # millisecondes. Désélectionnés par défaut pour garder une boucle de retour
  # courte pendant le développement ; ils restent indispensables avant de
  # livrer. Le marqueur est posé automatiquement (voir
  # `pytest_collection_modifyitems` dans tests/conftest.py), rien à annoter.
  #   suite courte      : uv run pytest                      (~24 s)
  #   navigateur seul   : uv run pytest -m selenium          (~71 s)
  #   avant de livrer   : uv run pytest -m "not integration" (~84 s)
  # `-m ""` réinclut aussi les tests `integration`, qui échouent depuis une IP
  # non déclarée chez Brevo : à réserver aux cas où c'est justement ce qu'on
  # veut vérifier.
  "selenium: tests pilotant un vrai navigateur via dash_duo",
]
